
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071325">
  <title>DESA | Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #071325;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 420px;
      padding: 30px;
    }

    h1 {
      color: #e5a93c;
    }

    button {
      padding: 12px 24px;
      border: 0;
      background: #e5a93c;
      color: #071325;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>DESA</h1>
    <h2>You're currently offline</h2>
    <p>Please check your internet connection to continue using the DESA portal.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
